batch_size: 32           # A100: micro-batch; drop to 16 (and accum to 16) if it OOMs
grad_accum_steps: 8      # 32 x 8 = 256 sequences = 262,144 tokens per step
learning_rate: 0.0003
weight_decay: 0.05
grad_clip_norm: 1.0
eval_iters: 20
eval_interval: 250
checkpoint_interval: 1000
checkpoint_path: "checkpoints/pretrain"   # relative to repo root
num_warmup_steps: 500
init_linear_factor: 0.05
MAX_TRAINING_STEPS: 13150   # 3.45B tokens = 20 tokens/param (Chinchilla-optimal for 172.6M)
